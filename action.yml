name: 'Go Builder'
description: 'Builds golang projects with lots of options'
inputs:
  target:
    description: 'Path to build'
    required: false
    default: './...'
  version:
    description: 'Version number'
    required: false
    default: '0.0.0'
  location:
    description: 'Version variable location path'
    required: false
    default: ''
  date:
    description: 'Date created'
    required: false
    default: ''
  ld-library-path:
    description: 'shared library search path'
    required: false
    default: ''
  cgo-ldflags:
    description: 'Additional LDFLAGS passed to the C/C++ compiler by cgo'
    required: false
    default: ''
  cgo-cppflags:
    description: 'Additional CPPFLAGS passed to the C++ compiler by cgo'
    required: false
    default: ''
  extldflags:
    description: 'Parameter passed to the -extldflags options of ldflags'
    required: false
    default: '-static'
  cross-os:
    description: 'GOOS env variable for cross compilation - see `go tool dist list`'
    required: false
    default: ''
  cross-arch:
    description: 'GOARCH env variable for cross compilation - see `go tool dist list`'
    required: false
    default: ''
  cgoenabled:
    description: 'cgo: auto (Go decides: on for a native build when a C compiler is found, off when cross-compiling), true (always on; a cross build then needs a C cross compiler) or false (always off)'
    required: false
    default: 'auto'
  tags:
    description: 'Build tags to pass to the go build command (space-separated)'
    required: false
    default: ''
  force-rebuild:
    description: 'Rebuild every package with go build -a instead of using the Go build cache (true or false). The cache is keyed on sources, flags, tags, environment and Go version, so the result is the same either way; -a only makes the build slower.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps: 
    - id: go-build
      run: |
        if [[ -n "${{ inputs.ld-library-path }}" ]]; then
          export LD_LIBRARY_PATH="${{ inputs.ld-library-path }}"
        fi

        # Go honours CGO_ENABLED only as 1 or 0; unset, it decides itself and turns cgo
        # off when cross-compiling. Up to v2.3.0 this exported "true" or "false", which Go
        # ignored, so every build got that automatic choice: auto keeps it.
        case "${{ inputs.cgoenabled }}" in
          true) export CGO_ENABLED=1 ;;
          false) export CGO_ENABLED=0 ;;
          auto) unset CGO_ENABLED ;;
          *)
            echo "::error::cgoenabled must be auto, true or false, not '${{ inputs.cgoenabled }}'"
            exit 1
            ;;
        esac

        if [[ "${CGO_ENABLED-}" != "0" ]]; then
          if [[ -n "${{ inputs.cgo-ldflags }}" ]]; then
            export CGO_LDFLAGS="${{ inputs.cgo-ldflags }}"
          fi
          if [[ -n "${{ inputs.cgo-cppflags }}" ]]; then
            export CGO_CPPFLAGS="${{ inputs.cgo-cppflags }}"
          fi
        else
          if [[ -n "${{ inputs.cgo-ldflags }}" || -n "${{ inputs.cgo-cppflags }}" ]]; then
            echo "Warning: cgoenabled is false, but cgo-ldflags or cgo-cppflags were provided. These will be ignored."
          fi
        fi

        ldflags="-s -w -extldflags '${{ inputs.extldflags }}'"
        if [[ -n "${{ inputs.location }}" ]]; then
          ldflags="-X ${{ inputs.location }}.commit=${{ github.sha }} $ldflags"
          ldflags="-X ${{ inputs.location }}.version=${{ inputs.version }} $ldflags"
          ldflags="-X ${{ inputs.location }}.date=${{ inputs.date }} $ldflags"
        fi

        if [[ -n "${{ inputs.cross-os }}" ]]; then
          export GOOS="${{ inputs.cross-os }}"
        fi
        if [[ -n "${{ inputs.cross-arch }}" ]]; then
          export GOARCH="${{ inputs.cross-arch }}"
        fi

        force_arg=()
        if [[ "${{ inputs.force-rebuild }}" == "true" ]]; then
          force_arg=(-a)
        fi

        tags_arg=()
        if [[ -n "${{ inputs.tags }}" ]]; then
          tags_arg=(-tags "${{ inputs.tags }}")
        fi

        echo "-----------------------------------------"
        echo "Executing:"
        echo "-----------------------------------------"
        echo go build "${force_arg[@]}" -trimpath "${tags_arg[@]}" -ldflags \"$ldflags\" ${{ inputs.target }}
        echo "-----------------------------------------"

        go build "${force_arg[@]}" -trimpath "${tags_arg[@]}" -ldflags "$ldflags" ${{ inputs.target }}
      shell: bash
